[eve]
name = "EVE OSS"
version = "0.1.0"
platform = "linux"
mode = "runtime"
sector = "core"

[logging]
level = "info"
format = "pretty"

[runtime]
deterministic = true
max_cycles = 64
critical_delay_ms = 100

[tools]
enabled = true
policy_path = "config/tool_policy.toml"

[model]
enabled = false
json_only = true

[memory]
sector_id = "core"
max_nodes_per_sector = 1024
max_edges_per_sector = 4096
