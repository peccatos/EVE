[package]
  name = "eve"
  version = "0.3.1"
  edition = "2021"
  rust-version = "1.83"
  description = "Deterministic orchestration runtime with JSON contracts, belief state, planner, memory,
  audit, and tool policy."
  license = "MIT OR Apache-2.0"
  publish = false

  [features]
  default = ["runtime", "audit", "tracking"]
  runtime = []
  audit = []
  tracking = []
  jsonschema-validation = ["dep:jsonschema"]
  cli = ["dep:clap"]

  [dependencies]
  # ---------------- serialization / contracts ----------------
  serde = { version = "1.0.228", features = ["derive"] }        # Serialize/Deserialize для всех
  контрактов, state и логов
  serde_json = "1.0.145"                                        # JSON: основной формат внешней границы
  EVE
  toml = "1.1.0"                                                # Чтение runtime/planner/tool-policy
  конфигов из .toml

  # ---------------- errors ----------------
  thiserror = "2.0.18"                                          # Typed domain errors: RuntimeError,
  ContractError, ToolError
  anyhow = "1.0.100"                                            # Удобный верхний error envelope для
  bin/CLI и glue-кода

  # ---------------- async runtime ----------------
  tokio = { version = "1.47.2", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] } # Async
  runtime, timers, fs, task orchestration

  # ---------------- tracking / observability ----------------
  tracing = "0.1.41"                                            # Structured spans/events вместо
  println-мусора
  tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter", "json"] } # Форматирование
  и фильтрация tracing-логов
  tracing-appender = "0.2.3"                                    # Ротация/вынос логов в файлы

  # ---------------- deterministic state / collections ----------------
  indexmap = { version = "2.11.4", features = ["serde"] }       # Стабильный порядок map для replay/
  логов/сериализации
  smallvec = "1.15.1"                                           # Лёгкие маленькие векторы, чтобы не
  плодить heap где не надо
  parking_lot = "0.12.4"                                        # Более лёгкие mutex/rwlock, чем std,
  для runtime state

  # ---------------- ids / paths / time ----------------
  uuid = { version = "1.18.1", features = ["v4", "serde"] }     # Stable ids для cycle/action/
  hypothesis/tool-call
  camino = { version = "1.2.1", features = ["serde1"] }         # UTF-8 paths без обычной path-каши
  chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] } # Метки
  времени для логов/audit

  # ---------------- rng / replay ----------------
  rand = "0.9.2"                                                # RNG traits/utilities
  rand_chacha = "0.9.0"                                         # ChaCha RNG для deterministic replay по
  seed

  # ---------------- schemas / validation ----------------
  schemars = { version = "1.0.4", features = ["derive"] }       # Генерация JSON Schema из Rust-типов
  jsonschema = { version = "0.33.0", optional = true }          # Runtime validation входного JSON
  против JSON Schema

  # ---------------- config / parsing niceties ----------------
  serde_with = "3.15.0"                                         # Аккуратная сериализация сложных полей/
  новых типов

  # ---------------- CLI ----------------
  clap = { version = "4.5.48", features = ["derive"], optional = true } # eve_run / eve_audit /
  eve_replay CLI

  [dev-dependencies]
  tokio-test = "0.4.4"                                          # Тесты async-логики
  tracing-test = "0.2.5"                                        # Проверка tracing в тестах
  tempfile = "3.23.0"                                           # Временные файлы/директории для tool/
  runtime tests
  pretty_assertions = "1.4.1"                                   # Читабельные diffs в тестах
  serde_json = "1.0.145"                                        # JSON fixtures в тестах

  [profile.dev]
  debug = true
  opt-level = 0

  [profile.release]
  lto = "thin"
  codegen-units = 1
  strip = "debuginfo"
  panic = "abort"
