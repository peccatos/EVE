[package]
name = "kernel"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
authors = ["Peccatos"]
description = "EVE OSS kernel"
license = "MIT"
publish = false

[features]
default = []
cli = ["dep:clap"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4.5", features = ["derive"], optional = true }

[dev-dependencies]
pretty_assertions = "1.4"

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
